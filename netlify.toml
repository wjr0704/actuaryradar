[build]
  publish = "outputs/actuary_radar_site"
  command = "python3 work/actuary_digest_mvp/src/build_site.py --base-url https://insuranceactuaryhub.com"
  functions = "work/actuary_digest_mvp/netlify/functions"

# Check hourly so a delayed digest is sent soon after it is published. The
# delivery table's subscriber/date constraint prevents duplicate editions.
[functions."newsletter-daily-send"]
  schedule = "0 * * * *"

[[redirects]]
  from = "/api/newsletter/subscribe"
  to = "/.netlify/functions/newsletter-subscribe"
  status = 200

[[redirects]]
  from = "/api/newsletter/confirm"
  to = "/.netlify/functions/newsletter-confirm"
  status = 200

[[redirects]]
  from = "/api/newsletter/unsubscribe"
  to = "/.netlify/functions/newsletter-unsubscribe"
  status = 200

[[redirects]]
  from = "/api/newsletter/send-daily"
  to = "/.netlify/functions/newsletter-daily-send"
  status = 200

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/.netlify/functions/daily-refresh"
  [headers.values]
    Cache-Control = "public, max-age=300, s-maxage=1800"
